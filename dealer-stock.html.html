<style>
  :root{
    --bg:#0e141c;
    --bg2:#0a0f15;
    --card1:#1c2836;
    --card2:#131c26;
    --line:#26333f;
    --accent:#f2a93b;
    --accent-dim:#8a6a30;
    --profit:#2fce6f;
    --loss:#ef5a5a;
    --plate:#f2c94c;
    --text:#eef3f8;
    --muted:#8b9aab;
    --muted2:#5d6b7a;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    overflow:hidden;
    position:fixed; inset:0;
  }
  .disp{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.2px;}
  #app{
    height:100%; width:100%; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; position:relative;
    background:linear-gradient(180deg, #101821 0%, #0a0f15 100%);
  }
  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px 18px; flex-shrink:0;
  }
  .topbar h1{
    font-size:34px; margin:0; font-family:'Barlow Condensed',sans-serif; font-weight:800;
    letter-spacing:0.3px;
  }
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); display:flex; align-items:center; justify-content:center;
    color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:19px; height:19px;}
  .icon-btn.accent{ background:var(--accent); border-color:var(--accent); color:#241703; }

  /* ---------- Scroll area ---------- */
  .scroll{ flex:1; overflow-y:auto; padding:6px 16px 100px 16px; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar{display:none;}

  .empty{
    margin-top:60px; text-align:center; color:var(--muted); padding:0 30px;
  }
  .empty .big{font-size:44px; margin-bottom:10px;}
  .empty .disp{font-size:22px; color:var(--text); margin-bottom:6px;}

  /* ---------- Car card (Apple-Weather style) ---------- */
  .car-card{
    position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:14px;
    background: linear-gradient(135deg, var(--card1), var(--card2));
    padding:16px 16px 14px 16px; cursor:pointer; user-select:none;
    border:1px solid var(--line);
    min-height:150px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .car-card .bgimg{
    position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:0.55; filter:saturate(0.9);
  }
  .car-card .bgimg.placeholder{
    display:flex; align-items:center; justify-content:center; opacity:0.16; font-size:80px;
  }
  .car-card .scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,15,21,0.15) 0%, rgba(10,15,21,0.85) 100%);
  }
  .car-card .content{ position:relative; z-index:2; display:flex; flex-direction:column; height:100%; justify-content:space-between;}
  .status-dot{
    position:absolute; top:14px; left:14px; width:11px; height:11px; border-radius:50%; z-index:3;
    box-shadow:0 0 0 3px rgba(0,0,0,0.25);
  }
  .status-dot.on{ background:var(--profit); }
  .status-dot.off{ background:var(--loss); }
  .car-top{ display:flex; justify-content:flex-end; }
  .plate{
    display:inline-block; background:var(--plate); color:#141414; font-weight:700;
    padding:3px 10px; border-radius:5px; font-size:14px; letter-spacing:1.5px;
    font-family:'Inter',sans-serif; border:1px solid #d4ab1f;
  }
  .car-name{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; margin-top:auto; }
  .car-sub{ color:var(--muted); font-size:13px; margin-top:2px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; left:0; right:0; bottom:0; display:flex;
    background:rgba(14,20,28,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    flex-shrink:0;
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted2); background:none; border:none; padding:6px 0; cursor:pointer;
  }
  .navbtn.active{ color:var(--accent); }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn span{ font-size:11px; font-weight:600; }

  /* ---------- Modal / sheet ---------- */
  .overlay{
    position:absolute; inset:0; background:rgba(4,6,9,0.6); z-index:50;
    display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--card2); width:100%; border-radius:22px 22px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom)) 18px; max-height:88%; overflow-y:auto;
    border:1px solid var(--line); border-bottom:none;
  }
  .sheet h2{ font-family:'Barlow Condensed',sans-serif; font-size:24px; margin:2px 0 16px 0;}
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; background:var(--card1); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:11px; font-size:15px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:1px solid var(--accent); }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }
  .btn{
    width:100%; padding:13px; border-radius:13px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn.primary{ background:var(--accent); color:#241703; }
  .btn.ghost{ background:var(--card1); color:var(--text); border:1px solid var(--line); }
  .btn.danger{ background:var(--loss); color:#2a0808; }
  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn-row > *{ flex:1; }
  .close-x{ position:absolute; top:14px; right:16px; color:var(--muted); font-size:22px; background:none; border:none; cursor:pointer;}

  /* ---------- Detail page ---------- */
  .detail{ position:absolute; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; }
  .detail-hero{
    position:relative; height:200px; flex-shrink:0; background-size:cover; background-position:center;
  }
  .detail-hero .placeholder{ display:flex; align-items:center; justify-content:center; height:100%; font-size:90px; opacity:0.2; background:linear-gradient(135deg,var(--card1),var(--card2)); }
  .detail-hero .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,9,13,0.35), rgba(10,15,21,1)); }
  .detail-hero .back{
    position:absolute; top:16px; left:14px; z-index:5; width:38px; height:38px; border-radius:11px;
    background:rgba(10,15,21,0.55); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center;
  }
  .detail-hero .title-wrap{ position:absolute; bottom:14px; left:18px; z-index:4; }
  .detail-hero .title-wrap .car-name{ font-size:28px; }
  .detail-body{ flex:1; overflow-y:auto; padding:14px 16px 110px 16px; -webkit-overflow-scrolling:touch; }
  .detail-body::-webkit-scrollbar{display:none;}

  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{ flex:1; border-radius:15px; padding:12px 12px; }
  .stat-box .lbl{ font-size:11px; font-weight:700; opacity:0.85; text-transform:uppercase; letter-spacing:0.4px;}
  .stat-box .val{ font-family:'Barlow Condensed',sans-serif; font-size:23px; font-weight:700; margin-top:3px; }
  .stat-box.green{ background:rgba(47,206,111,0.16); color:var(--profit); border:1px solid rgba(47,206,111,0.35); }
  .stat-box.neutral{ background:var(--card1); color:var(--text); border:1px solid var(--line); }
  .stat-box.profit-pos{ background:rgba(47,206,111,0.16); color:var(--profit); border:1px solid rgba(47,206,111,0.35); }
  .stat-box.profit-neg{ background:rgba(239,90,90,0.16); color:var(--loss); border:1px solid rgba(239,90,90,0.35); }

  .adv-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card1); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:18px;}
  .adv-row .l{ font-size:14px; font-weight:600; }
  .adv-row .l .sub{ display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px;}
  .switch{ width:46px; height:27px; border-radius:20px; position:relative; cursor:pointer; flex-shrink:0; transition:background 0.15s;}
  .switch.on{ background:var(--profit); } .switch.off{ background:#3a4653; }
  .switch .knob{ position:absolute; top:2.5px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left 0.15s; }
  .switch.on .knob{ left:21.5px; } .switch.off .knob{ left:2.5px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px 0; }
  .section-head h3{ font-family:'Barlow Condensed',sans-serif; font-size:20px; margin:0; font-weight:700; }
  .add-round{ width:30px; height:30px; border-radius:50%; background:var(--accent); color:#241703; border:none; font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:0;}

  .cost-row{ background:var(--card1); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px; }
  .cost-row .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .cost-row .part{ font-weight:700; font-size:14.5px; }
  .cost-row .amount{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; color:var(--accent); }
  .cost-row .meta{ font-size:12px; color:var(--muted); margin-top:3px; }
  .costs-total{ display:flex; justify-content:space-between; padding:10px 4px 4px 4px; color:var(--muted); font-size:13px; font-weight:600; }
  .costs-total b{ color:var(--text); font-size:15px; }

  .sold-bar-wrap{ position:absolute; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom)) 16px; background:linear-gradient(180deg, rgba(14,20,28,0), var(--bg) 30%); }
  .sold-bar{ width:100%; padding:15px; border-radius:14px; border:none; background:var(--accent); color:#241703; font-weight:800; font-size:15px; letter-spacing:0.5px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; }
  .sold-bar.disabled{ background:var(--card1); color:var(--muted); }

  /* ---------- Summary ---------- */
  .period-pills{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; }
  .period-pills::-webkit-scrollbar{display:none;}
  .pill{ flex-shrink:0; padding:8px 14px; border-radius:20px; background:var(--card1); border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; }
  .pill.active{ background:var(--accent); color:#241703; border-color:var(--accent); }

  .profit-hero{ text-align:center; padding:26px 10px 20px 10px; border-radius:20px; margin-bottom:16px; border:1px solid var(--line); }
  .profit-hero .lbl{ font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;}
  .profit-hero .figure{ font-family:'Barlow Condensed',sans-serif; font-size:52px; font-weight:800; margin-top:4px;}
  .profit-hero .figure.pos{ color:var(--profit); } .profit-hero .figure.neg{ color:var(--loss); }
  .profit-hero .sub{ color:var(--muted2); font-size:12px; margin-top:6px; }
  .swipe-hint{ text-align:center; color:var(--muted2); font-size:11px; margin-bottom:14px;}

  .graph-wrap{ background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:14px 10px 8px 10px; margin-bottom:18px;}
  canvas{ width:100%; display:block; }

  .mini-stats{ display:flex; gap:10px; }
  .mini-stat{ flex:1; background:var(--card1); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .mini-stat .n{ font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; }
  .mini-stat .l{ font-size:11px; color:var(--muted); margin-top:2px; }

  /* ---------- Previous list ---------- */
  .prev-row{ background:var(--card1); border:1px solid var(--line); border-radius:15px; padding:13px 14px; margin-bottom:10px; }
  .prev-row .top{ display:flex; justify-content:space-between; align-items:center; }
  .prev-row .name{ font-weight:700; font-size:15px; }
  .prev-row .profit{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:18px; }
  .prev-row .profit.pos{ color:var(--profit);} .prev-row .profit.neg{ color:var(--loss);}
  .prev-row .meta{ font-size:12px; color:var(--muted); margin-top:5px; display:flex; justify-content:space-between;}

  .recycle-item{ background:var(--card1); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center;}
  .recycle-item .n{ font-weight:700; font-size:14px; }
  .recycle-item .d{ font-size:11px; color:var(--muted); margin-top:2px;}
  .small-btn{ padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:12px; font-weight:600; cursor:pointer;}

  .toast{
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%); background:#1c2836; border:1px solid var(--line);
    padding:10px 18px; border-radius:12px; font-size:13px; z-index:80; opacity:0; transition:opacity 0.2s; pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORE_KEY = 'dealer-stock-data';
const PROVIDERS = ['Euro Car Parts', 'Ebay', 'Parkers', 'Bullseye'];

let DATA = { cars: [], deleted: [] };
let VIEW = 'stock'; // stock | summary | previous
let openCarId = null;
let summaryPeriod = 'month'; // today, week, month, 3months, year
let summaryShowGraph = false;
let touchTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){
  const v = Number(n)||0;
  return '£' + v.toLocaleString('en-GB', {maximumFractionDigits:0});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function carCosts(car){ return (car.costs||[]).reduce((s,c)=>s+(Number(c.amount)||0),0); }
function carProfit(car){
  const sale = car.sold ? Number(car.soldPrice)||0 : Number(car.predictedSalePrice)||0;
  return sale - (Number(car.purchasePrice)||0) - carCosts(car);
}

const LOCAL_KEY = 'forecourt_data_v1';

async function loadData(){
  let loaded = false;
  // Primary: Claude artifact preview storage (persists when viewed inside claude.ai)
  try{
    if(window.storage){
      const r = await window.storage.get('data', false);
      if(r && r.value){ DATA = JSON.parse(r.value); loaded = true; }
    }
  }catch(e){ /* not running inside claude.ai preview, or key not set yet */ }
  // Fallback: browser local storage (persists when the file is downloaded and opened
  // directly, e.g. saved to the phone's home screen) — used if the primary storage
  // isn't available or had nothing saved yet.
  if(!loaded){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ DATA = JSON.parse(raw); loaded = true; }
    }catch(e){ /* private browsing or storage disabled */ }
  }
  if(!DATA.cars) DATA.cars = [];
  if(!DATA.deleted) DATA.deleted = [];
  purgeOldDeleted();
}
async function saveData(){
  const json = JSON.stringify(DATA);
  let savedSomewhere = false;
  try{ await window.storage.set('data', json, false); savedSomewhere = true; }
  catch(e){ /* fall through to local storage */ }
  try{ localStorage.setItem(LOCAL_KEY, json); savedSomewhere = true; }
  catch(e){ /* fall through */ }
  if(!savedSomewhere){ showToast('Could not save — try again'); }
}
function purgeOldDeleted(){
  const now = Date.now();
  const THIRTY = 30*24*60*60*1000;
  DATA.deleted = DATA.deleted.filter(c => (now - new Date(c.deletedAt).getTime()) < THIRTY);
}

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div'); t.id='toast'; t.className='toast';
    document.getElementById('app').appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- SUMMARY VIEW ---------------- */
const PERIODS = [
  {key:'today', label:'Today'},
  {key:'week', label:'This Week'},
  {key:'month', label:'This Month'},
  {key:'3months', label:'3 Months'},
  {key:'year', label:'This Year'},
  {key:'lastyear', label:'Last Year'},
  {key:'2yearsago', label:'2 Years Ago'},
];
function getPeriodRange(key){
  const now = new Date();
  if(key==='today'){ const s=new Date(now); s.setHours(0,0,0,0); return {start:s, end:new Date(now.getTime()+60000)}; }
  if(key==='week'){ return {start:new Date(now.getTime()-7*86400000), end:now}; }
  if(key==='month'){ return {start:new Date(now.getTime()-30*86400000), end:now}; }
  if(key==='3months'){ return {start:new Date(now.getTime()-90*86400000), end:now}; }
  if(key==='year'){ return {start:new Date(now.getTime()-365*86400000), end:now}; }
  if(key==='lastyear'){ const y=now.getFullYear()-1; return {start:new Date(y,0,1), end:new Date(y+1,0,1)}; }
  if(key==='2yearsago'){ const y=now.getFullYear()-2; return {start:new Date(y,0,1), end:new Date(y+1,0,1)}; }
}
function carsSoldInPeriod(key){
  const range = getPeriodRange(key);
  return DATA.cars.filter(c=>{
    if(!c.sold || !c.soldDate) return false;
    const t = new Date(c.soldDate).getTime();
    return t >= range.start.getTime() && t < range.end.getTime();
  });
}

function bucketLabelAndGrouper(period){
  // returns {buckets: [{label, start, end}], }
  const now = new Date();
  let buckets = [];
  if(period==='today'){
    for(let h=0; h<24; h+=4){
      buckets.push({label:`${h}:00`, start:new Date(now.getFullYear(),now.getMonth(),now.getDate(),h), end:new Date(now.getFullYear(),now.getMonth(),now.getDate(),h+4)});
    }
  } else if(period==='week'){
    for(let i=6;i>=0;i--){
      const d = new Date(now); d.setDate(now.getDate()-i); d.setHours(0,0,0,0);
      const e = new Date(d); e.setDate(d.getDate()+1);
      buckets.push({label:d.toLocaleDateString('en-GB',{weekday:'short'}), start:d, end:e});
    }
  } else if(period==='month'){
    for(let i=29;i>=0;i--){
      const d = new Date(now); d.setDate(now.getDate()-i); d.setHours(0,0,0,0);
      const e = new Date(d); e.setDate(d.getDate()+1);
      buckets.push({label:d.getDate().toString(), start:d, end:e});
    }
  } else if(period==='3months'){
    for(let i=12;i>=0;i--){
      const e = new Date(now); e.setDate(now.getDate()-(i*7)); e.setHours(0,0,0,0);
      const d = new Date(e); d.setDate(e.getDate()-7);
      buckets.push({label:'W'+(13-i), start:d, end:e});
    }
  } else if(period==='year'){
    for(let i=11;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const e = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
      buckets.push({label:d.toLocaleDateString('en-GB',{month:'short'}), start:d, end:e});
    }
  } else if(period==='lastyear' || period==='2yearsago'){
    const y = period==='lastyear' ? now.getFullYear()-1 : now.getFullYear()-2;
    for(let m=0; m<12; m++){
      const d = new Date(y, m, 1);
      const e = new Date(y, m+1, 1);
      buckets.push({label:d.toLocaleDateString('en-GB',{month:'short'}), start:d, end:e});
    }
  }
  return buckets;
}

function drawGraph(){
  const canvas = document.getElementById('graphCanvas');
  if(!canvas) return;
  const buckets = bucketLabelAndGrouper(summaryPeriod);
  const sold = DATA.cars.filter(c=>c.sold && c.soldDate);
  const values = buckets.map(b=>{
    const inb = sold.filter(c=>{
      const t = new Date(c.soldDate).getTime();
      return t >= b.start.getTime() && t < b.end.getTime();
    });
    return inb.reduce((s,c)=>s+carProfit(c),0);
  });

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 160;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const max = Math.max(1, ...values.map(v=>Math.abs(v)));
  const zeroY = h/2;
  const barW = (w / values.length) * 0.6;
  const gap = (w / values.length);

  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'center';
  values.forEach((v,i)=>{
    const x = gap*i + gap/2;
    const barH = (Math.abs(v)/max) * (h/2 - 20);
    ctx.fillStyle = v>=0 ? '#2fce6f' : '#ef5a5a';
    if(v>=0){
      ctx.fillRect(x-barW/2, zeroY-barH, barW, barH);
    } else {
      ctx.fillRect(x-barW/2, zeroY, barW, barH);
    }
    ctx.fillStyle = '#5d6b7a';
    ctx.fillText(buckets[i].label, x, h-4);
  });
  ctx.strokeStyle = '#26333f';
  ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(w,zeroY); ctx.stroke();
}

function openSheet(html){
  const app = document.getElementById('app');
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'activeOverlay';
  wrap.innerHTML = `<div class="sheet">${html}</div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeSheet(); });
  app.appendChild(wrap);
}
function closeSheet(){
  const el = document.getElementById('activeOverlay');
  if(el) el.remove();
}

function openDeleteConfirm(car){
  openSheet(`
    <h2>Delete this car?</h2>
    <p style="color:var(--muted); font-size:14px; margin-top:-8px;">${escapeHtml(car.year||'')} ${escapeHtml(car.make||'')} ${escapeHtml(car.model||'')} · ${escapeHtml(car.reg||'')} will move to the recycle bin for 30 days.</p>
    <div class="btn-row">
      <button class="btn ghost" id="sheetCancel">Cancel</button>
      <button class="btn danger" id="sheetDelete">Delete</button>
    </div>
  `);
  document.getElementById('sheetCancel').onclick = closeSheet;
  document.getElementById('sheetDelete').onclick = async ()=>{
    DATA.cars = DATA.cars.filter(c=>c.id!==car.id);
    DATA.deleted.push({...car, deletedAt: new Date().toISOString()});
    await saveData();
    closeSheet();
    render();
    showToast('Moved to recycle bin');
  };
}

function openRecycleBin(){
  purgeOldDeleted();
  const items = DATA.deleted.slice().sort((a,b)=> new Date(b.deletedAt)-new Date(a.deletedAt));
  openSheet(`
    <button class="close-x" id="sheetClose">×</button>
    <h2>Recycle bin</h2>
    <p style="color:var(--muted); font-size:13px; margin-top:-10px;">Deleted cars are kept for 30 days.</p>
    ${items.length===0 ? `<div style="color:var(--muted2); padding:20px 0; text-align:center; font-size:14px;">Nothing here.</div>` :
      items.map(c=>{
        const daysLeft = 30 - Math.floor((Date.now()-new Date(c.deletedAt).getTime())/(24*60*60*1000));
        return `
        <div class="recycle-item">
          <div>
            <div class="n">${escapeHtml(c.year||'')} ${escapeHtml(c.make||'')} ${escapeHtml(c.model||'')}</div>
            <div class="d">${escapeHtml(c.reg||'')} · ${daysLeft} day${daysLeft===1?'':'s'} left</div>
          </div>
          <button class="small-btn" data-restore="${c.id}">Restore</button>
        </div>`;
      }).join('')
    }
  `);
  document.getElementById('sheetClose').onclick = closeSheet;
  document.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-restore');
      const idx = DATA.deleted.findIndex(c=>c.id===id);
      if(idx>-1){
        const [car] = DATA.deleted.splice(idx,1);
        delete car.deletedAt;
        DATA.cars.push(car);
        await saveData();
        closeSheet();
        render();
        showToast('Restored');
      }
    };
  });
}

/* ---------------- HELPERS ---------------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }

/* ---------------- EVENT WIRING ---------------- */
function attachHandlers(){
  // bottom nav
  document.querySelectorAll('.navbtn').forEach(btn=>{
    btn.onclick = ()=>{ VIEW = btn.getAttribute('data-view'); summaryShowGraph=false; render(); };
  });

  // top bar
  const addCarBtn = document.getElementById('btnAddCar');
  if(addCarBtn) addCarBtn.onclick = openAddCarSheet;
  const recycleBtn = document.getElementById('btnRecycle');
  if(recycleBtn) recycleBtn.onclick = openRecycleBin;

  // car cards: tap to open, long-press to delete
  document.querySelectorAll('.car-card').forEach(card=>{
    const id = card.getAttribute('data-id');
    let longPressed = false;
    const start = ()=>{
      longPressed = false;
      touchTimer = setTimeout(()=>{
        longPressed = true;
        const car = DATA.cars.find(c=>c.id===id);
        if(car) openDeleteConfirm(car);
      }, 550);
    };
    const cancel = ()=>{ clearTimeout(touchTimer); };
    card.addEventListener('touchstart', start, {passive:true});
    card.addEventListener('touchend', cancel);
    card.addEventListener('touchmove', cancel);
    card.addEventListener('mousedown', start);
    card.addEventListener('mouseup', cancel);
    card.addEventListener('mouseleave', cancel);
    card.addEventListener('click', ()=>{
      if(longPressed) return;
      openCarId = id;
      render();
    });
  });

  // summary
  document.querySelectorAll('[data-period]').forEach(p=>{
    p.onclick = ()=>{ summaryPeriod = p.getAttribute('data-period'); summaryShowGraph=false; render(); };
  });
  const hero = document.getElementById('profitHero');
  if(hero) hero.onclick = ()=>{ summaryShowGraph = !summaryShowGraph; render(); setTimeout(drawGraph, 10); };
  const graphToggleBtn = document.getElementById('toggleGraphBtn');
  if(graphToggleBtn) graphToggleBtn.onclick = ()=>{ summaryShowGraph = !summaryShowGraph; render(); setTimeout(drawGraph, 10); };
  if(summaryShowGraph) setTimeout(drawGraph, 10);

  // detail
  const backBtn = document.getElementById('btnBack');
  if(backBtn) backBtn.onclick = ()=>{ openCarId = null; render(); };
  const advSwitch = document.getElementById('advSwitch');
  if(advSwitch) advSwitch.onclick = async ()=>{
    const car = DATA.cars.find(c=>c.id===openCarId);
    car.advertised = !car.advertised;
    await saveData();
    render();
  };
  const addCostBtn = document.getElementById('btnAddCost');
  if(addCostBtn) addCostBtn.onclick = ()=>{
    const car = DATA.cars.find(c=>c.id===openCarId);
    openAddCostSheet(car);
  };
  const soldBtn = document.getElementById('btnSold');
  if(soldBtn) soldBtn.onclick = ()=>{
    const car = DATA.cars.find(c=>c.id===openCarId);
    openSoldSheet(car);
  };
  const editPredBtn = document.getElementById('btnEditPred');
  if(editPredBtn) editPredBtn.onclick = ()=>{
    const car = DATA.cars.find(c=>c.id===openCarId);
    openEditPredSheet(car);
  };
}

/* ---------------- INIT ---------------- */
(async function init(){
  await loadData();
  render();
})();

// Register service worker for offline support + installability.
// Only works when hosted over https (or localhost) — silently does nothing
// if opened directly as a local file, which is fine, the app still works.
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
